<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style></style>
  </head>
  <body>
    <nav>
      <strong
        style="color: var(--primary); font-size: 2rem; letter-spacing: -0.5px"
        >Sturez</strong
      >
      <div class="nav-links">
        <a onclick="showPage('dashboard')" id="nav-dashboard" class="active"
          >Dashboard</a
        >
        <a onclick="showPage('database')" id="nav-database">View Student</a>
        <a onclick="showPage('add')" id="nav-add">Add Student</a>
      </div>
    </nav>

    <div class="main-content">
      <div class="container">
        <div id="page-dashboard" class="page active">
          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
              gap: 25px;
            "
          >
            <div class="stat-card" style="grid-column: span 3">
              <h3
                style="
                  font-size: 0.8rem;
                  color: var(--slate);
                  text-transform: uppercase;
                "
              >
                Total Enrollment
              </h3>
              <p
                id="dash-total"
                style="
                  color: var(--primary);
                  font-size: 3rem;
                  margin: 10px 0;
                  font-weight: 900;
                "
              >
                0
              </p>
            </div>
            <div class="stat-card">
              <h3>Male</h3>
              <p
                id="dash-male"
                style="color: #3b82f6; font-size: 2rem; margin: 0"
              >
                0
              </p>
            </div>
            <div class="stat-card">
              <h3>Female</h3>
              <p
                id="dash-female"
                style="color: #ec4899; font-size: 2rem; margin: 0"
              >
                0
              </p>
            </div>
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 25px;
              margin-top: 25px;
            "
          >
            <div class="card">
              <h2 style="font-size: 1.1rem; margin-top: 0">🌟 Top Achievers</h2>
              <div
                id="star-container"
                style="display: flex; gap: 10px; flex-wrap: wrap"
              ></div>
            </div>
            <div
              class="card"
              style="display: flex; flex-direction: column; align-items: center"
            >
              <h3
                style="
                  font-size: 0.8rem;
                  color: var(--slate);
                  margin-bottom: 20px;
                "
              >
                GENDER SPLIT
              </h3>
              <div style="width: 200px; height: 200px">
                <canvas id="genderChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div id="page-add" class="page">
          <div class="card" style="max-width: 600px; margin: auto">
            <h2 id="form-title" style="margin-top: 0">Student Registration</h2>
            <input type="text" id="stuId" placeholder="ID Number" />
            <input type="text" id="stuName" placeholder="Full Name" />
            <select id="stuGender">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
            <div id="subjectList">
              <div style="display: flex; gap: 12px; margin-bottom: 12px">
                <input type="text" class="sub-n" placeholder="Subject" />
                <input
                  type="number"
                  class="sub-s"
                  placeholder="Score"
                  style="width: 100px"
                />
              </div>
            </div>
            <button
              class="btn"
              onclick="addSubjectInput()"
              style="
                background: #f1f5f9;
                color: var(--primary);
                margin-bottom: 20px;
                width: 100%;
              "
            >
              + Add Subject
            </button>
            <button
              class="btn btn-primary"
              onclick="saveRecord()"
              id="saveBtn"
              style="width: 100%"
            >
              Complete Registration
            </button>
          </div>
        </div>

        <div id="page-database" class="page">
          <input
            type="text"
            id="search"
            placeholder="🔍 Search records..."
            onkeyup="renderTable()"
            style="margin-bottom: 30px; padding: 18px"
          />
          <div class="table-box">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Gender</th>
                  <th>Results</th>
                  <th>Avg</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
